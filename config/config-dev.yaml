app:
  name: xserver
  env: dev
  debug: true
  version: 1.0.0
  file_url: ""
  mode: mixed

servers:
  mixed:
    port: 8800
  api:
    port: 8801
  admin_api:
    port: 8802

redis:
  addr: 127.0.0.1:6379
  password: ""

database:
  driver: mysql
  dsn: root:123456@tcp(127.0.0.1)/gva?charset=utf8&parseTime=True&loc=Local

jwt:
  secret: 1234435435345345345
  expire_seconds: 86400

totp:
  enable: true
  issuer: xadmin

system:
  use-strict-auth: false

api-doc:
  enable: true
  output-swagger-file: static/swagger/api/swagger.json
  api-output-swagger-file: static/swagger/api/swagger.json
  admin-output-swagger-file: static/swagger/admin-api/swagger.json
  system-output-swagger-file: static/swagger/system/swagger.json
  # 如果文档中没有描述，那可能就是这里没有引入扫描包了
  gen-scan-dir:
    - pkg/context/api
    - internal/api
    - internal/system
    - internal/admin-api
    - internal/module
